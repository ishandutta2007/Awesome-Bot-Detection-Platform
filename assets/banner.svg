<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="title-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#4f46e5" stop-opacity=".3"/></linearGradient><linearGradient id="pulse-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/><stop offset="50%" stop-color="#22d3ee" stop-opacity=".8"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/></linearGradient><pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes pulseBeam{0%{stroke-dashoffset:400;opacity:.2}50%{opacity:.9}}@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-12px) scale(1.2);opacity:.9}}@keyframes scanline{0%{transform:translateY(-150px)}}@keyframes botNodePulse{0%{fill:#ef4444;r:4px}50%{fill:#f87171;r:7px;filter:drop-shadow(0 0 6px #ef4444)}}@keyframes shieldPulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.03);opacity:1}}.radar-line{transform-origin:980px 175px;animation:radarSweep 10s linear infinite}.pulse-line{stroke-dasharray:100 300;animation:pulseBeam 4s ease-in-out infinite}.particle{animation:floatParticle 5s ease-in-out infinite}.bot-node{animation:botNodePulse 2.5s ease-in-out infinite}.shield-icon{transform-origin:980px 175px;animation:shieldPulse 4s ease-in-out infinite}</style><rect width="1200" height="350" fill="url(#bg-gradient)"/><rect width="1200" height="350" fill="url(#cyber-grid)"/><g id="radar-system"><circle cx="980" cy="175" r="140" fill="none" stroke="#1e293b" stroke-width="1.5"/><circle cx="980" cy="175" r="100" fill="none" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/><circle cx="980" cy="175" r="60" fill="none" stroke="#0284c7" stroke-opacity=".4" stroke-width="1"/><circle cx="980" cy="175" r="20" fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1"/><line x1="980" x2="1120" y1="175" y2="175" stroke="#38bdf8" stroke-width="2" class="radar-line" filter="url(#soft-glow)"/><circle cx="930" cy="110" r="5" class="bot-node"/><text x="940" y="112" fill="#f87171" font-family="monospace" font-size="10">BOT: Scraper [BLOCKED]</text><circle cx="1040" cy="220" r="5" class="bot-node" style="animation-delay:.8s"/><text x="1050" y="224" fill="#f87171" font-family="monospace" font-size="10">BOT: ATO Script [BLOCKED]</text><circle cx="910" cy="230" r="4" fill="#38bdf8"/><text x="860" y="245" fill="#38bdf8" font-family="monospace" font-size="10">AI Agent [VERIFIED]</text><g class="shield-icon" filter="url(#glow)"><path fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2" d="M 980 135 L 1015 152 V 185 C 1015 208 980 220 980 220 C 980 220 945 208 945 185 V 152 Z"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M 970 175 L 977 183 L 993 167"/></g></g><path fill="none" stroke="#334155" stroke-width="1.5" d="M 500 80 L 750 80 L 880 135"/><path fill="none" stroke="url(#pulse-grad)" stroke-width="2.5" d="M 500 80 L 750 80 L 880 135" class="pulse-line"/><path fill="none" stroke="#334155" stroke-width="1.5" d="M 550 270 L 780 270 L 920 220"/><path fill="none" stroke="url(#pulse-grad)" stroke-width="2.5" d="M 550 270 L 780 270 L 920 220" class="pulse-line" style="animation-delay:2s"/><circle cx="150" cy="60" r="2" fill="#38bdf8" class="particle"/><circle cx="450" cy="300" r="3" fill="#818cf8" class="particle" style="animation-delay:1s"/><circle cx="720" cy="50" r="2.5" fill="#c084fc" class="particle" style="animation-delay:2.5s"/><g><g transform="translate(60, 0) translate(0, 55)"><rect width="260" height="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#22c55e" filter="url(#soft-glow)"/><text x="30" y="18" fill="#c7d2fe" font-size="11" font-weight="600" letter-spacing=".5">CYBERSECURITY &amp; BOT DEFENSE</text></g><text x="0" y="145" fill="url(#title-gradient)" filter="url(#soft-glow)" font-size="38" font-weight="800" letter-spacing="-.5" transform="translate(60, 0)">Awesome Bot Detection Platform</text><text width="600" x="0" y="185" fill="#94a3b8" font-size="16" font-weight="400" transform="translate(60, 0)">Curated Ecosystem of SaaS Solutions &amp; Open-Source Defense Tools</text><g><g transform="translate(60, 0) translate(0, 220) translate(0, 0)"><rect width="165" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="14" y="20" fill="#38bdf8" font-size="12" font-weight="600">🛡️ Web Scraping Defense</text></g><g transform="translate(60, 0) translate(0, 220) translate(177, 0)"><rect width="180" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="14" y="20" fill="#a7f3d0" font-size="12" font-weight="600">🤖 AI Agent Governance</text></g><g transform="translate(60, 0) translate